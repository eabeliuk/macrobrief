# Cloud Build pipeline for MacroBrief.
#
#   build web + migrator → push → migrate (Cloud Run Job) → deploy
#
# Migrations run in a Cloud Run Job *before* the new revision rolls out. If the
# migrate step fails, the prior revision keeps serving — fix the migration and
# redeploy rather than letting a half-migrated schema go live.
#
# One-time wiring is handled by `./deploy.sh --setup`.

substitutions:
  _REGION: us-central1
  _REPO: macrobrief
  _SERVICE: macrobrief-web
  _MIGRATE_JOB: macrobrief-migrate
  # The origin the service answers on — deploy.sh fills this in (custom domain
  # once mapped, run.app URL until then, empty on the first deploy). OAuth
  # callbacks and magic links are built from it.
  _SITE_URL: ""
  _SQL_INSTANCE: macrobrief1:us-central1:macrobrief-db
  # Private bucket for audio briefs; created by ./deploy.sh --setup.
  _AUDIO_BUCKET: macrobrief1-audio

steps:
  - id: build-web
    name: gcr.io/cloud-builders/docker
    args:
      - build
      - --target
      - runner
      - -t
      - ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/web:${BUILD_ID}
      - -t
      - ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/web:latest
      - .

  - id: build-migrator
    name: gcr.io/cloud-builders/docker
    args:
      - build
      - --target
      - migrator
      - -t
      - ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/migrate:${BUILD_ID}
      - .

  - id: push-web
    name: gcr.io/cloud-builders/docker
    args: [push, "--all-tags", "${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/web"]

  - id: push-migrator
    name: gcr.io/cloud-builders/docker
    args: [push, "${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/migrate:${BUILD_ID}"]

  - id: migrate
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: bash
    args:
      - -c
      - |
        set -e
        gcloud run jobs deploy ${_MIGRATE_JOB} \
          --image=${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/migrate:${BUILD_ID} \
          --project=${PROJECT_ID} --region=${_REGION} \
          --set-cloudsql-instances=${_SQL_INSTANCE} \
          --set-secrets=DATABASE_URL=macrobrief-database-url:latest \
          --max-retries=0 --task-timeout=600s
        gcloud run jobs execute ${_MIGRATE_JOB} \
          --project=${PROJECT_ID} --region=${_REGION} --wait

  - id: deploy
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: bash
    args:
      - -c
      - |
        set -e

        # Only map secrets that actually have a version. An empty placeholder
        # secret has none, and `--set-secrets=X=name:latest` on one of those
        # fails the rollout — so an unconfigured integration is simply not
        # mapped, and the app's "that feature isn't configured" path handles it.
        SECRETS=""
        add() {
          if gcloud secrets versions describe latest --secret="$$2" \
               --project=${PROJECT_ID} >/dev/null 2>&1; then
            SECRETS="$${SECRETS:+$$SECRETS,}$$1=$$2:latest"
          else
            echo "skipping $$1 — secret $$2 has no version yet"
          fi
        }

        # Required. Without these the service cannot serve a request.
        add DATABASE_URL macrobrief-database-url
        add AUTH_SECRET macrobrief-auth-secret
        # Optional — each one activates a feature when it is populated.
        add AUTH_GOOGLE_ID macrobrief-google-id
        add AUTH_GOOGLE_SECRET macrobrief-google-secret
        add AUTH_RESEND_KEY macrobrief-resend-key
        add ANTHROPIC_API_KEY macrobrief-anthropic-key
        add TWILIO_ACCOUNT_SID macrobrief-twilio-sid
        add TWILIO_AUTH_TOKEN macrobrief-twilio-token
        add TWILIO_WHATSAPP_FROM macrobrief-twilio-whatsapp-from
        add TWILIO_WA_TEMPLATE_SID macrobrief-twilio-wa-template
        add STRIPE_SECRET_KEY macrobrief-stripe-secret
        add STRIPE_WEBHOOK_SECRET macrobrief-stripe-webhook-secret
        add STRIPE_PRICE_STARTER macrobrief-stripe-price-starter
        add STRIPE_PRICE_PRO macrobrief-stripe-price-pro
        add STRIPE_PRICE_MAX macrobrief-stripe-price-max
        add CRON_SECRET macrobrief-cron-secret
        add SUPER_ADMINS macrobrief-super-admins
        add ALLOWED_EMAILS macrobrief-allowed-emails

        echo "Mapping secrets: $$SECRETS"

        SITE_ENV=""
        if [ -n "${_SITE_URL}" ]; then
          SITE_ENV=",NEXT_PUBLIC_SITE_URL=${_SITE_URL},AUTH_URL=${_SITE_URL}"
        fi

        # NOTE: --set-secrets REPLACES the whole set on every deploy. Anything
        # attached later with `gcloud run services update --update-secrets` is
        # dropped by the next deploy unless it is added to the list above.
        gcloud run deploy ${_SERVICE} \
          --image=${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/web:${BUILD_ID} \
          --project=${PROJECT_ID} \
          --region=${_REGION} \
          --platform=managed \
          --allow-unauthenticated \
          --port=8080 \
          --cpu=1 --memory=512Mi \
          --min-instances=0 --max-instances=4 \
          --add-cloudsql-instances=${_SQL_INSTANCE} \
          --set-env-vars="AUTH_TRUST_HOST=true,AUDIO_BUCKET=${_AUDIO_BUCKET}$${SITE_ENV}" \
          --set-secrets="$$SECRETS"

        # --allow-unauthenticated only warns in a non-interactive build, which
        # leaves the first revision returning 403 to everyone. Bind allUsers
        # explicitly — idempotent, and it actually takes effect.
        if gcloud run services add-iam-policy-binding ${_SERVICE} \
             --project=${PROJECT_ID} --region=${_REGION} \
             --member=allUsers --role=roles/run.invoker >/dev/null 2>&1; then
          echo "public invoker binding confirmed"
        else
          echo "WARNING: could not set the public invoker binding."
          echo "  If the service returns 403, run:"
          echo "  gcloud run services add-iam-policy-binding ${_SERVICE} --project=${PROJECT_ID} --region=${_REGION} --member=allUsers --role=roles/run.invoker"
        fi

images:
  - ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/web:${BUILD_ID}
  - ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/web:latest

timeout: 1800s
options:
  # New projects often lack the default logs bucket; stream to Cloud Logging only.
  logging: CLOUD_LOGGING_ONLY
  machineType: E2_HIGHCPU_8
