<!--
  MacroBrief isotype

  Family geometry, inherited unchanged: the isometric M on the 1000 x 698.86
  canvas, with the mark's object seated in the M's notch on the same band the
  sibling tiles sit on, and drawn BEHIND the M.

  What sits in the notch is what differs, and it is the only part that carries
  meaning. MacroBrief's object is a GLOBE — the news icon everyone already
  reads — with its equator and one meridian knocked out as transparent lines.
  It is drawn large and seated low, so the M's V cuts its lower third: the
  world rising behind the M, and the M in front of it as the thing that
  selects what reaches you.

  The graticule and the gap along the M are knocked out, not painted, in every
  variant: filled solid the globe is a plain disc and could be a coin, and in
  one ink it would fuse with the M into a single blob.

  Generated by brandbook/build.py. Do not hand-edit.
-->
